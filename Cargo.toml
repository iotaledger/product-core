[workspace.package]
authors = ["IOTA Stiftung"]
edition = "2024"
homepage = "https://www.iota.org"
license = "Apache-2.0"
repository = "https://github.com/iotaledger/product-core"

[workspace]
resolver = "2"
members = ["product-core", "bindings/wasm/iota_interaction_ts"]

[workspace.dependencies]
iota-sdk = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "25907f345ed0deb33a56fe40677d1d128209ffea" }
thiserror = "2"
url = { version = "2.5.7", features = ["serde"] }
http = { version = "1.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secret-storage = { git = "https://github.com/iotaledger/secret-storage.git", branch = "prototype/new-signer-api", features = [
  "iota",
] }
# product-common
anyhow = "1"
async-trait = "0.1.89"
bcs = "0.2.1"
toml = "1.1.2"
hyper = "1"
tokio = "1"